site_name: GALib
site_description: A small, extensible library to build genetic algorithms in Python.
site_author: CARMELO LA GAMBA
site_url: https://carmelolg.github.io/GALib/
repo_url: https://github.com/carmelolg/GALib
repo_name: GitHub
copyright: Copyright &copy; 2026 <a href="https://carmelolg.github.io" target="_blank" rel="noopener">CARMELO LA GAMBA</a> &middot; Apache License 2.0

docs_dir: docs

# docs/overrides holds theme templates, not pages: use them to build the site, do not publish them
exclude_docs: |
  /overrides/

theme:
  name: material
  custom_dir: docs/overrides  # partials/footer.html
  language: en
  font: false  # system fonts (see stylesheets/extra.css): no request to Google, faster first paint
  logo: assets/logo-teal.svg  # drawer title; header and footer pick a variant per theme in extra.css
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Three states: follow the system, force light, force dark.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: "Theme: automatic (click for light)"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: "Theme: light (click for dark)"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: "Theme: dark (click for automatic)"
  features:
    - navigation.instant          # pages load without a full refresh
    - navigation.instant.prefetch # start loading a page when the pointer hovers a link
    - navigation.instant.progress # progress bar on slow connections
    - navigation.tracking         # the URL follows the section being read
    - navigation.sections
    - navigation.path             # breadcrumbs above the title
    - navigation.top
    - navigation.footer           # previous / next page links
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link           # choosing a tab selects the same tab on every page
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/carmelolg/GALib
      name: Source code on GitHub

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true

nav:
  - Getting started:
      - Overview: index.md
      - Quick start: getting-started.md
      - Concepts: concepts.md
  - User guide:
      - Defining a problem: guide/problem.md
      - Operators: guide/operators.md
      - The engine: guide/engine.md
      - Monitoring and stopping: guide/monitoring.md
      - Performance and numpy: guide/performance.md
  - Examples:
      - Examples: examples.md
  - API reference:
      - Overview: reference/index.md
      - Core: reference/core.md
      - Operators: reference/operators.md
      - Stop conditions and callbacks: reference/termination-callbacks.md
      - Metrics and plotting: reference/metrics-plot.md
  - Project:
      - Changelog: changelog.md
      - License: license.md
